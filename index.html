<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Unity Web Player | voiture game</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>

    /* =========================================================
       PAGE
       ========================================================= */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #111;
    }


    /* =========================================================
       CONTENEUR UNITY
       ========================================================= */

    #unity-container {
      width: 100%;
      height: 100%;

      display: flex;

      justify-content: center;
      align-items: center;
    }


    #unity-fullscreen-container {

      position: relative;

      width: 960px;
      height: 600px;

      max-width: 100vw;
      max-height: 100vh;

      overflow: hidden;
    }


    /* =========================================================
       CANVAS
       ========================================================= */

    #unity-canvas {

      width: 100%;
      height: 100%;

      display: block;

      background: #000;
    }


    /* =========================================================
       CHARGEMENT
       ========================================================= */

    #unity-loading-container {

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      display: flex;

      justify-content: center;
      align-items: center;

      pointer-events: none;
    }


    /* =========================================================
       CONTROLES MOBILES
       ========================================================= */

    #mobile-controls {

      display: none;

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 100;
    }


    /* =========================================================
       BOUTONS ↑ ↓
       ========================================================= */

    .control-button {

      position: absolute;

      width: 75px;
      height: 75px;

      border-radius: 18px;

      border: 3px solid rgba(255, 255, 255, 0.75);

      background: rgba(20, 20, 20, 0.55);

      color: white;

      font-size: 36px;
      font-weight: bold;

      display: flex;

      justify-content: center;
      align-items: center;

      pointer-events: auto;

      user-select: none;
      -webkit-user-select: none;

      touch-action: none;

      -webkit-tap-highlight-color: transparent;

      box-sizing: border-box;
    }


    .control-button:active {

      background: rgba(255, 255, 255, 0.35);

      transform: scale(0.94);
    }


    /* =========================================================
       ACCELERER
       ========================================================= */

    #accelerate {

      right: 25px;
      bottom: 125px;
    }


    /* =========================================================
       RECULER
       ========================================================= */

    #reverse {

      right: 25px;
      bottom: 35px;
    }


    /* =========================================================
       JOYSTICK
       ========================================================= */

    #joystick {

      position: absolute;

      left: 25px;
      bottom: 30px;

      width: 150px;
      height: 150px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.15);

      border: 3px solid rgba(255, 255, 255, 0.55);

      pointer-events: auto;

      touch-action: none;

      user-select: none;
      -webkit-user-select: none;

      box-sizing: border-box;
    }


    /* =========================================================
       BOUTON DU JOYSTICK
       ========================================================= */

    #joystick-stick {

      position: absolute;

      width: 65px;
      height: 65px;

      left: 42.5px;
      top: 42.5px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.65);

      border: 2px solid white;

      box-sizing: border-box;

      pointer-events: none;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 800px), (pointer: coarse) {

      #unity-container {

        width: 100vw;
        height: 100vh;
      }


      #unity-fullscreen-container {

        width: 100vw;
        height: 100vh;

        max-width: none;
        max-height: none;
      }


      #unity-canvas {

        width: 100vw;
        height: 100vh;
      }


      #mobile-controls {

        display: block;
      }


      #unity-footer {

        display: none;
      }
    }

  </style>

</head>


<body>


  <!-- =========================================================
       UNITY
       ========================================================= -->

  <div id="unity-container" class="unity-desktop">

    <div id="unity-fullscreen-container">


      <!-- =====================================================
           CANVAS UNITY
           ===================================================== -->

      <canvas
        id="unity-canvas"
        width="1280"
        height="720"
        tabindex="-1">
      </canvas>


      <!-- =====================================================
           CHARGEMENT
           ===================================================== -->

      <div id="unity-loading-container">

        <div id="unity-loading-bar">

          <div id="unity-logo"></div>

          <div id="unity-progress-bar-empty">

            <div id="unity-progress-bar-full"></div>

          </div>

        </div>

      </div>


      <!-- =====================================================
           CONTROLES TELEPHONE
           ===================================================== -->

      <div id="mobile-controls">


        <!-- ===================================================
             JOYSTICK
             =================================================== -->

        <div id="joystick">

          <div id="joystick-stick"></div>

        </div>


        <!-- ===================================================
             BOUTON ACCELERER
             =================================================== -->

        <div
          id="accelerate"
          class="control-button">

          ↑

        </div>


        <!-- ===================================================
             BOUTON RECULER
             =================================================== -->

        <div
          id="reverse"
          class="control-button">

          ↓

        </div>


      </div>


    </div>


    <!-- =======================================================
         WARNING UNITY
         ======================================================= -->

    <div id="unity-warning"></div>


    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <div id="unity-footer">

      <div id="unity-logo-title-footer"></div>

      <div id="unity-fullscreen-button"></div>

      <div id="unity-build-title">
        voiture game
      </div>

    </div>


  </div>


  <script>

    /* =========================================================
       ELEMENTS
       ========================================================= */

    let canvas =
      document.querySelector("#unity-canvas");

    let fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");


    /* =========================================================
       MESSAGE UNITY
       ========================================================= */

    function unityShowBanner(msg, type) {

      var warningBanner =
        document.querySelector("#unity-warning");


      function updateBannerVisibility() {

        warningBanner.style.display =
          warningBanner.children.length
            ? "block"
            : "none";
      }


      var div =
        document.createElement("div");


      div.innerHTML = msg;


      warningBanner.appendChild(div);


      if (type == "error") {

        div.style =
          "background: red; padding: 10px;";

      }

      else {

        if (type == "warning") {

          div.style =
            "background: yellow; padding: 10px;";
        }


        setTimeout(function () {

          if (div.parentNode) {

            warningBanner.removeChild(div);

          }

          updateBannerVisibility();

        }, 5000);
      }


      updateBannerVisibility();
    }


    /* =========================================================
       CONFIGURATION UNITY
       ========================================================= */

    var buildUrl = "Build";


    var loaderUrl =
      buildUrl + "/jeu.loader.js";


    var config = {

      arguments: [],

      dataUrl:
        buildUrl + "/jeu.data",

      frameworkUrl:
        buildUrl + "/jeu.framework.js",

      codeUrl:
        buildUrl + "/jeu.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      fullscreenElementID:
        "unity-fullscreen-container",

      companyName:
        "DefaultCompany",

      productName:
        "voiture game",

      productVersion:
        "0.1.0",

      showBanner:
        unityShowBanner
    };


    /* =========================================================
       DETECTION TELEPHONE
       ========================================================= */

    if (
      /iPhone|iPad|iPod|Android/i.test(
        navigator.userAgent
      )
    ) {

      var meta =
        document.createElement("meta");


      meta.name = "viewport";


      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";


      document
        .getElementsByTagName("head")[0]
        .appendChild(meta);


      document
        .querySelector("#unity-container")
        .className = "unity-mobile";


      canvas.className =
        "unity-mobile";
    }


    /* =========================================================
       SIMULATION DES TOUCHES CLAVIER
       =========================================================

       On envoie les événements directement sur le canvas Unity.

       ↑ = ArrowUp
       ↓ = ArrowDown
       ← = ArrowLeft
       → = ArrowRight

       ========================================================= */


    function getKeyCode(key) {

      switch (key) {

        case "ArrowUp":
          return 38;

        case "ArrowDown":
          return 40;

        case "ArrowLeft":
          return 37;

        case "ArrowRight":
          return 39;

        default:
          return 0;
      }
    }


    function keyDown(key) {

      const code =
        getKeyCode(key);


      const event =
        new KeyboardEvent(
          "keydown",
          {

            key: key,

            code: key,

            keyCode: code,

            which: code,

            bubbles: true,

            cancelable: true
          }
        );


      canvas.dispatchEvent(event);
    }


    function keyUp(key) {

      const code =
        getKeyCode(key);


      const event =
        new KeyboardEvent(
          "keyup",
          {

            key: key,

            code: key,

            keyCode: code,

            which: code,

            bubbles: true,

            cancelable: true
          }
        );


      canvas.dispatchEvent(event);
    }


    /* =========================================================
       BOUTONS ↑ ET ↓
       ========================================================= */

    function setupButton(
      id,
      key
    ) {

      const button =
        document.getElementById(id);


      /* -------------------------------------------------------
         TOUCH START
         ------------------------------------------------------- */

      button.addEventListener(
        "touchstart",

        function (event) {

          event.preventDefault();

          keyDown(key);

        },

        {
          passive: false
        }
      );


      /* -------------------------------------------------------
         TOUCH END
         ------------------------------------------------------- */

      button.addEventListener(
        "touchend",

        function (event) {

          event.preventDefault();

          keyUp(key);

        },

        {
          passive: false
        }
      );


      /* -------------------------------------------------------
         TOUCH CANCEL
         ------------------------------------------------------- */

      button.addEventListener(
        "touchcancel",

        function (event) {

          event.preventDefault();

          keyUp(key);

        },

        {
          passive: false
        }
      );


      /* -------------------------------------------------------
         SOURIS
         ------------------------------------------------------- */

      button.addEventListener(
        "mousedown",

        function (event) {

          event.preventDefault();

          keyDown(key);

        }
      );


      button.addEventListener(
        "mouseup",

        function (event) {

          event.preventDefault();

          keyUp(key);

        }
      );


      button.addEventListener(
        "mouseleave",

        function () {

          keyUp(key);

        }
      );
    }


    /* =========================================================
       ACTIVATION DES BOUTONS
       ========================================================= */

    setupButton(
      "accelerate",
      "ArrowUp"
    );


    setupButton(
      "reverse",
      "ArrowDown"
    );


    /* =========================================================
       JOYSTICK
       ========================================================= */

    const joystick =
      document.getElementById(
        "joystick"
      );


    const stick =
      document.getElementById(
        "joystick-stick"
      );


    let joystickActive =
      false;


    let leftPressed =
      false;


    let rightPressed =
      false;


    /* =========================================================
       RELACHER LE JOYSTICK
       ========================================================= */

    function releaseJoystick() {

      if (leftPressed) {

        keyUp("ArrowLeft");

        leftPressed = false;
      }


      if (rightPressed) {

        keyUp("ArrowRight");

        rightPressed = false;
      }


      /* Retour au centre */

      stick.style.left =
        "42.5px";


      stick.style.top =
        "42.5px";


      joystickActive =
        false;
    }


    /* =========================================================
       CALCUL DU JOYSTICK
       ========================================================= */

    function updateJoystick(
      clientX,
      clientY
    ) {

      const rect =
        joystick.getBoundingClientRect();


      const centerX =
        rect.left +
        rect.width / 2;


      const centerY =
        rect.top +
        rect.height / 2;


      let x =
        clientX - centerX;


      let y =
        clientY - centerY;


      const maxDistance =
        42;


      /* Limite horizontale */

      x =
        Math.max(
          -maxDistance,
          Math.min(
            maxDistance,
            x
          )
        );


      /* Limite verticale */

      y =
        Math.max(
          -maxDistance,
          Math.min(
            maxDistance,
            y
          )
        );


      /* Déplacement visuel */

      stick.style.left =
        (42.5 + x) + "px";


      stick.style.top =
        (42.5 + y) + "px";


      const deadZone =
        15;


      /* =====================================================
         GAUCHE
         ===================================================== */

      if (x < -deadZone) {

        if (!leftPressed) {

          keyDown(
            "ArrowLeft"
          );

          leftPressed = true;
        }

      }

      else {

        if (leftPressed) {

          keyUp(
            "ArrowLeft"
          );

          leftPressed = false;
        }
      }


      /* =====================================================
         DROITE
         ===================================================== */

      if (x > deadZone) {

        if (!rightPressed) {

          keyDown(
            "ArrowRight"
          );

          rightPressed = true;
        }

      }

      else {

        if (rightPressed) {

          keyUp(
            "ArrowRight"
          );

          rightPressed = false;
        }
      }
    }


    /* =========================================================
       JOYSTICK - TOUCH START
       ========================================================= */

    joystick.addEventListener(
      "touchstart",

      function (event) {

        event.preventDefault();


        joystickActive =
          true;


        const touch =
          event.touches[0];


        updateJoystick(
          touch.clientX,
          touch.clientY
        );

      },

      {
        passive: false
      }
    );


    /* =========================================================
       JOYSTICK - TOUCH MOVE
       ========================================================= */

    joystick.addEventListener(
      "touchmove",

      function (event) {

        event.preventDefault();


        if (!joystickActive) {

          return;
        }


        const touch =
          event.touches[0];


        updateJoystick(
          touch.clientX,
          touch.clientY
        );

      },

      {
        passive: false
      }
    );


    /* =========================================================
       JOYSTICK - TOUCH END
       ========================================================= */

    joystick.addEventListener(
      "touchend",

      function (event) {

        event.preventDefault();

        releaseJoystick();

      },

      {
        passive: false
      }
    );


    /* =========================================================
       JOYSTICK - TOUCH CANCEL
       ========================================================= */

    joystick.addEventListener(
      "touchcancel",

      function (event) {

        event.preventDefault();

        releaseJoystick();

      },

      {
        passive: false
      }
    );


    /* =========================================================
       SOURIS POUR LE JOYSTICK
       ========================================================= */

    joystick.addEventListener(
      "mousedown",

      function (event) {

        event.preventDefault();

        joystickActive =
          true;


        updateJoystick(
          event.clientX,
          event.clientY
        );
      }
    );


    document.addEventListener(
      "mousemove",

      function (event) {

        if (!joystickActive) {

          return;
        }


        updateJoystick(
          event.clientX,
          event.clientY
        );
      }
    );


    document.addEventListener(
      "mouseup",

      function () {

        if (joystickActive) {

          releaseJoystick();
        }
      }
    );


    /* =========================================================
       CHARGEMENT DU BUILD UNITY
       ========================================================= */

    var script =
      document.createElement("script");


    script.src =
      loaderUrl;


    script.onload = () => {

      const loadingContainer =
        document.querySelector(
          "#unity-loading-container"
        );


      const progressBarFull =
        document.querySelector(
          "#unity-progress-bar-full"
        );


      createUnityInstance(
        canvas,
        config,

        (progress) => {

          if (progress < 1) {

            loadingContainer.style.display =
              "block";


            progressBarFull.style.width =
              (100 * progress) + "%";

          }

          else {

            loadingContainer.style.display =
              "none";
          }

        }

      )

      .then(
        (unityInstance) => {

          /* ===============================================
             PLEIN ECRAN
             =============================================== */

          document
            .querySelector(
              "#unity-fullscreen-button"
            )
            .onclick = () => {

              unityInstance.SetFullscreen(1);

            };

        }
      )

      .catch(
        (message) => {

          alert(message);

        }
      );

    };


    document.body.appendChild(
      script
    );

  </script>

</body>

</html>
